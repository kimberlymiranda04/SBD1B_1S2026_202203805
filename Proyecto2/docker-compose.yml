version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-container
    ports:
      - "1522:1521"
    environment:
      - ORACLE_PASSWORD=123
      - APP_USER=BD1
      - APP_USER_PASSWORD=123
    volumes:
      - ./scripts:/container-entrypoint-initdb.d
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "BD1/123@//localhost:1521/XEPDB1"]
      interval: 30s
      retries: 10
      start_period: 60s
      timeout: 10s

volumes:
  oracle-data: